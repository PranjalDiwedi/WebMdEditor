<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="favGradMainL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="favGradMainR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="favGradBackL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="favGradBackR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="favGradBookL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="favGradBookR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="favGradStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Left Secondary Peak -->
  <polygon points="8,32 16,14 24,28" fill="url(#favGradBackL)" opacity="0.85" />

  <!-- Right Secondary Peak -->
  <polygon points="24,28 32,14 40,32" fill="url(#favGradBackR)" opacity="0.85" />

  <!-- Central Mountain - Left Face -->
  <polygon points="24,7 12,32 24,27" fill="url(#favGradMainL)" />

  <!-- Central Mountain - Right Face -->
  <polygon points="24,7 24,27 36,32" fill="url(#favGradMainR)" />

  <!-- Peak Snowcap -->
  <polygon points="24,7 19,16 24,14 29,16" fill="#ffffff" opacity="0.9" />

  <!-- Knowledge Strata -->
  <path d="M 16 23 L 24 19.5 L 32 23" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" />
  <path d="M 14 28 L 24 24 L 34 28" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />

  <!-- Open Book Base (Left Page) -->
  <path d="M 24 33 C 15 31 6 34 4 36.5 C 6 39.5 15 42 24 43.5 Z" fill="url(#favGradBookL)" opacity="0.95" />

  <!-- Open Book Base (Right Page) -->
  <path d="M 24 33 C 33 31 42 34 44 36.5 C 42 39.5 33 42 24 43.5 Z" fill="url(#favGradBookR)" opacity="0.95" />

  <!-- Book Spine Center -->
  <line x1="24" y1="33" x2="24" y2="43.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

  <!-- Left Page Script -->
  <path d="M 9 36.5 C 14 35 19 36 22 37.5" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.6" />
  <path d="M 11 39 C 15 37.8 19 38.5 22 39.8" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" opacity="0.45" />

  <!-- Right Page Script -->
  <path d="M 39 36.5 C 34 35 29 36 26 37.5" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.6" />
  <path d="M 37 39 C 33 37.8 29 38.5 26 39.8" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" opacity="0.45" />

  <!-- Summit Star Beacon -->
  <path d="M 24 1.5 Q 24 6 28 6 Q 24 6 24 10.5 Q 24 6 20 6 Q 24 6 24 1.5 Z" fill="url(#favGradStar)" />
  <circle cx="24" cy="6" r="1.2" fill="#ffffff" />
</svg>