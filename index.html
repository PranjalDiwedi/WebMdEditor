<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Google Fonts: Inter and JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet" />
    <!-- Baseline CSP for local/preview. Production Netlify uses public/_headers (stricter). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://apis.google.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; connect-src 'self' ws: wss: http://localhost:* http://127.0.0.1:* https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com https://apis.google.com; frame-src https://accounts.google.com https://content.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="description" content="Mandrak is a fast, distraction-free, local-first Markdown editor with native file system access and seamless Google Drive cloud sync. 100% private and client-side." />
    <meta name="keywords" content="Mandrak, markdown editor, mountain of knowledge, local-first markdown, private markdown editor, offline markdown editor, google drive markdown sync, browser markdown editor, wysiwyg markdown" />
    <meta name="author" content="Mandrak" />
    <meta name="theme-color" content="#121215" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mandrak — Fast, Private, Local-First Markdown Editor" />
    <meta property="og:description" content="A distraction-free, lightning-fast Markdown editor with native local file access and seamless Google Drive sync. 100% private." />
    <meta property="og:site_name" content="Mandrak" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mandrak — Fast, Private, Local-First Markdown Editor" />
    <meta name="twitter:description" content="A distraction-free, lightning-fast Markdown editor with native local file access and seamless Google Drive sync. 100% private." />

    <!-- JSON-LD Structured Data for Google Rich Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Mandrak",
      "applicationCategory": "ProductivityApplication",
      "operatingSystem": "All",
      "browserRequirements": "Requires JavaScript. Requires HTML5.",
      "description": "Fast, private, local-first markdown editor with native file system access and Google Drive cloud sync.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Local File System Access API",
        "Google Drive Cloud Sync",
        "Tri-Mode Split & Reader Preview",
        "100% Client-Side Privacy",
        "Zero-Latency Editing"
      ]
    }
    </script>

    <title>Mandrak — Fast, Private Markdown Editor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
